  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="505" cy="515" r="366" fill="#071C4A" opacity="0.15"/>
  <path d="M 752 251 A 352 352 0 1 0 829 694" fill="none" stroke="#071C4A" stroke-width="174" stroke-linecap="round" opacity="0.18"/>
  <path d="M 752 251 A 352 352 0 1 0 829 694" fill="none" stroke="url(#cycle)" stroke-width="128" stroke-linecap="round"/>
  <path d="M 752 251 A 352 352 0 0 1 828 350" fill="none" stroke="#5AA5B3" stroke-width="128" stroke-linecap="round"/>
