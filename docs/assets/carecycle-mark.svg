<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CareCycle mark</title>
  <desc id="desc">A blue and teal cycle surrounding a sensor and infusion device.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D61D4"/>
      <stop offset="0.56" stop-color="#1E58B7"/>
      <stop offset="1" stop-color="#3D8795"/>
    </linearGradient>
    <linearGradient id="cycle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5FBFF"/>
      <stop offset="1" stop-color="#CBEAF4"/>
    </linearGradient>
    <linearGradient id="frontDevice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9E2FA"/>
    </linearGradient>
    <linearGradient id="sensor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6F2F1"/>
      <stop offset="1" stop-color="#63AEB8"/>
